
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baba Tea Stall - Owner Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#222}
header{background:#713b19;color:white;padding:20px}
main{max-width:850px;margin:20px auto;padding:16px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #ddd}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #ccc;font-size:16px}
button{background:#713b19;color:white;border:0;font-weight:bold}
.order{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:8px;overflow-wrap:anywhere}
.small{color:#666;font-size:14px}
</style>
</head>
<body>
<header>
<h2>☕ Baba Tea Stall</h2>
<div>Owner Dashboard</div>
</header>
<main>
<div class="card" id="login">
<h3>Owner Login</h3>
<input id="email" type="email" placeholder="Owner Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message" class="small">Owner account se login karein.</p>
</div>
<div class="card" id="panel" hidden>
<h3>Today's orders / सभी ऑर्डर</h3>
<p id="status" class="small">ऑर्डर लोड हो रहे हैं...</p>
<div id="orders"></div>
<button id="logoutBtn">Logout</button>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCHrLvNiMhTsDdz0UFcWIBatmBymDeUR7k",
  authDomain: "baba-tea-stall.firebaseapp.com",
  projectId: "baba-tea-stall",
  appId: "1:298419832106:web:02fd00a6975c23dc780a53"
};

const loginBox = document.getElementById("login");
const panel = document.getElementById("panel");
const message = document.getElementById("message");

try {
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  let unsubscribe = null;

  document.getElementById("loginBtn").onclick = async () => {
    message.textContent = "Login ki jaanch ho rahi hai...";
    try {
      await auth.signInWithEmailAndPassword(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
    } catch (e) {
      message.textContent ="Login Error: " + e.code + " - " + e.message;
    }
  };

  auth.onAuthStateChanged(user => {
    loginBox.hidden = !!user;
    panel.hidden = !user;
    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }
    if (!user) return;

    document.getElementById("status").textContent = "Firebase se orders check ho rahe hain...";
    unsubscribe = db.collection("orders").onSnapshot (snapshot => {
      const container = document.getElementById("orders");
      container.replaceChildren();
      if (snapshot.empty) {
        document.getElementById("status").textContent =
          "Abhi Firebase mein koi order save nahi hai.";
        return;
      }
      document.getElementById("status").textContent =
        "Kul records: " + snapshot.size;

      snapshot.forEach(doc => {
        const card = document.createElement("div");
        card.className = "order";
        const title = document.createElement("h4");
        title.textContent = "Order ID: " + doc.id;
        const details = document.createElement("pre");
        details.style.whiteSpace = "pre-wrap";
        details.textContent = JSON.stringify(doc.data(), null, 2);
        card.append(title, details);
        container.appendChild(card);
      });
    }, error => {
      document.getElementById("status").textContent =
        "Orders load nahi hue. Firestore security rules check karein.";
    });
  });

  document.getElementById("logoutBtn").onclick =
    () => auth.signOut();
} catch (e) {
  message.textContent = "Firebase configuration abhi bharna baaki hai.";
}
</script>
</body>
</html>
